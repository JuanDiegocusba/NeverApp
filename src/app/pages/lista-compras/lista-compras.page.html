<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Lista de Compras</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Lista de Compras</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item lines="none" class="ion-margin-bottom">
    <ion-input [(ngModel)]="nuevoItemNombre" placeholder="Añadir artículo (ej. Servilletas)"></ion-input>
    <ion-button slot="end" (click)="agregarArticulo()">
      <ion-icon slot="icon-only" name="add"></ion-icon>
    </ion-button>
  </ion-item>

  <ion-list lines="inset">
    @for (item of articulosCompra; track item.id) {
      <ion-item>
        <ion-checkbox 
          [checked]="item.comprado" 
          (ionChange)="marcarComprado(item.id)">
          <ion-label [class.comprado-text]="item.comprado">
            {{ item.nombre }}
          </ion-label>
        </ion-checkbox>
      </ion-item>
    } @empty {
      <ion-item lines="none">
        <ion-label class="ion-text-center">
          <p>¡Todo al día! No tienes pendientes por comprar.</p>
        </ion-label>
      </ion-item>
    }
  </ion-list>

  @if (articulosCompra.length > 0) {
    <div class="ion-margin-top ion-padding-horizontal">
      <ion-button expand="block" color="success" (click)="finalizarCompra()">
        <ion-icon slot="start" name="checkmark-circle"></ion-icon>
        Finalizar Compra
      </ion-button>
    </div>
  }

</ion-content>
