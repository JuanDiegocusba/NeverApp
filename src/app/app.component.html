<ion-menu menuId="main-menu" contentId="main-content">
  <ion-header>
    <ion-toolbar color="light">
      <ion-title class="menu-title">NeverApp</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-list lines="none" class="menu-list">
      
      <ion-item routerLink="/tabs/dashboard" routerLinkActive="active-item">
        <ion-icon slot="start" name="home-outline"></ion-icon>
        <ion-label>Dashboard</ion-label>
      </ion-item>

      <ion-item routerLink="/tabs/inventario" routerLinkActive="active-item">
        <ion-icon slot="start" name="list-outline"></ion-icon>
        <ion-label>Lista de alimentos</ion-label>
      </ion-item>

      <ion-item routerLink="/tabs/compras" routerLinkActive="active-item">
        <ion-icon slot="start" name="cart-outline"></ion-icon>
        <ion-label>Lista de compras</ion-label>
      </ion-item>

      <ion-item routerLink="/tabs/categorias" routerLinkActive="active-item">
        <ion-icon slot="start" name="grid-outline"></ion-icon>
        <ion-label>Categorías</ion-label>
      </ion-item>

      <ion-item routerLink="/tabs/alertas" routerLinkActive="active-item">
        <ion-icon slot="start" name="warning-outline"></ion-icon>
        <ion-label>Alertas</ion-label>
      </ion-item>

      <ion-item routerLink="/tabs/ajustes" routerLinkActive="active-item">
        <ion-icon slot="start" name="settings-outline"></ion-icon>
        <ion-label>Configuración</ion-label>
      </ion-item>

      <ion-item class="logout-item" button (click)="cerrarSesion()">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>
        <ion-label>Cerrar sesión</ion-label>
      </ion-item>

    </ion-list>
  </ion-content>
</ion-menu>

<ion-router-outlet id="main-content"></ion-router-outlet>
